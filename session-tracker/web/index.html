<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Sessions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e13;
    --surface: #10151c;
    --surface2: #171e27;
    --border: #232b36;
    --border-soft: #1a212b;
    --border-hover: #33404f;
    --text: #dce5ef;
    --muted: #94a1b1;
    --faint: #5d6979;
    --accent: #e0795a;
    --accent-bright: #eb8b6d;
    --accent-soft: rgba(224, 121, 90, 0.14);
    --link: #5b9dd9;
    --ok: #46b26b;
    --warn: #d19a2f;
    --err: #e5544b;
    --info: #5b9dd9;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 1px;
  }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .brand {
    font-size: 1.05rem;
    font-weight: 650;
    white-space: nowrap;
  }
  .brand .bhost { color: var(--faint); font-weight: 400; font-size: 0.85rem; }
  .search-box {
    flex: 1;
    min-width: 220px;
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.92rem;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--link); outline: none; }
  .search-box::placeholder { color: var(--faint); font-family: var(--mono); font-size: 0.85rem; }
  .kpis { display: flex; gap: 8px; }
  .kpi {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    background: var(--surface2);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 4px 13px;
    white-space: nowrap;
  }
  .kpi b {
    font-size: 0.95rem;
    font-weight: 650;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .kpi small {
    font-size: 0.66rem;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .iconbtn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .iconbtn:hover { border-color: var(--accent); color: var(--text); }

  /* ---------- layout: sidebar + feed ---------- */
  .appbody {
    display: grid;
    grid-template-columns: 250px 1fr;
    max-width: 1400px;
    margin: 0 auto;
  }
  .sidebar {
    padding: 18px 16px 32px;
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 61px;
    align-self: start;
    max-height: calc(100vh - 61px);
    overflow-y: auto;
  }
  .facet h4 {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--faint);
    margin-bottom: 8px;
  }
  .facet-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 5px 9px;
    border: none;
    background: none;
    border-radius: 6px;
    font-size: 0.86rem;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }
  .facet-row:hover { background: var(--surface2); color: var(--text); }
  .facet-row.on { background: var(--accent-soft); color: var(--text); }
  .facet-row .fname {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .facet-row .fname.mono { font-family: var(--mono); font-size: 0.8rem; }
  .facet-row .cnt {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .facet-row .fhide {
    background: none; border: none; cursor: pointer;
    color: transparent;
    font-size: 0.75rem;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .facet-row:hover .fhide { color: var(--faint); }
  .facet-row .fhide:hover { color: var(--err); }
  .facet-more {
    background: none; border: none; cursor: pointer;
    color: var(--faint);
    font-size: 0.78rem;
    padding: 4px 9px;
    text-align: left;
  }
  .facet-more:hover { color: var(--link); }
  .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .st-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .serve-hint {
    font-size: 0.75rem;
    color: var(--faint);
    font-family: var(--mono);
    line-height: 1.6;
  }

  /* ---------- feed ---------- */
  .feed {
    padding: 16px 22px 48px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
  }
  .feed-tools {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.82rem;
    color: var(--faint);
  }
  .feed-tools .spacer { flex: 1; }
  .feed-tools .flabel { text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.06em; }
  .tool-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tool-chip:hover { border-color: var(--link); color: var(--link); }
  .tool-chip.active { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
  .filters-btn { display: none; }

  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 15px 18px 12px;
    transition: border-color 0.15s;
    cursor: pointer;
  }
  .card:hover { border-color: var(--border-hover); }
  .card.pinned { border-color: rgba(209, 154, 47, 0.45); }
  .card.card-hidden { opacity: 0.45; border-style: dashed; }
  .card.card-deleted { opacity: 0.45; border-style: dashed; border-color: var(--err); }

  .card-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 5px;
  }
  .card-title {
    font-size: 1.05rem;
    font-weight: 640;
    color: var(--text);
  }
  .card:hover .card-title { color: var(--link); }
  .card-pin { color: var(--warn); font-size: 0.95rem; flex-shrink: 0; }
  .cost {
    margin-left: auto;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    font-weight: 650;
    color: var(--text);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .cost small { color: var(--faint); font-weight: 400; font-size: 0.72rem; }

  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 9px;
  }
  .meta .sep { color: #2c3541; }
  .meta .mono { font-family: var(--mono); font-size: 0.76rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    white-space: nowrap;
    color: var(--muted);
  }
  .chip.model { font-family: var(--mono); color: var(--text); }
  .chip.proj { font-family: var(--mono); color: var(--link); cursor: pointer; }
  .chip.proj:hover { border-color: var(--link); }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 550;
    white-space: nowrap;
  }
  .pill-completed   { background: rgba(70,178,107,0.12); color: var(--ok); }
  .pill-in-progress { background: rgba(209,154,47,0.12); color: var(--warn); }
  .pill-exploring   { background: rgba(91,157,217,0.12); color: var(--info); }
  .pill-debugging   { background: rgba(229,84,75,0.12);  color: var(--err); }

  .card-summary {
    font-size: 0.9rem;
    color: var(--muted);
    max-width: 90ch;
    margin-bottom: 9px;
  }
  .card-note {
    font-size: 0.85rem;
    color: var(--warn);
    font-style: italic;
    border-left: 2px solid rgba(209, 154, 47, 0.4);
    padding-left: 10px;
    margin-bottom: 9px;
    white-space: pre-wrap;
  }

  .card-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-soft);
    padding-top: 10px;
    margin-top: 2px;
  }
  .topics { display: flex; gap: 6px; flex-wrap: wrap; }
  .topic {
    font-size: 0.73rem;
    color: var(--link);
    background: rgba(91, 157, 217, 0.09);
    border-radius: 12px;
    padding: 1px 9px;
    white-space: nowrap;
  }
  .dates {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .dates .dval { color: var(--muted); }
  .dates .rel { color: var(--accent); }
  .actions { margin-left: auto; display: flex; gap: 6px; flex-shrink: 0; }
  .abtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .abtn:hover { border-color: var(--link); color: var(--link); }
  .abtn.danger:hover { border-color: var(--err); color: var(--err); }
  .abtn.good { color: var(--ok); }
  .abtn.good:hover { border-color: var(--ok); color: var(--ok); }
  .abtn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #14100e;
    font-weight: 650;
  }
  .abtn.primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #14100e; }

  /* compact density: one glance per session */
  .cards.compact { gap: 8px; }
  .cards.compact .card { padding: 10px 16px 8px; }
  .cards.compact .card-summary,
  .cards.compact .card-note,
  .cards.compact .topics { display: none; }
  .cards.compact .card-head { margin-bottom: 3px; }
  .cards.compact .meta { margin-bottom: 6px; }
  .cards.compact .card-foot { border-top: none; padding-top: 0; }

  .no-results {
    text-align: center;
    color: var(--faint);
    padding: 60px 0;
    font-size: 1rem;
  }
  .copied-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--accent);
    color: #14100e;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.88rem;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 30;
  }
  .copied-toast.show { opacity: 1; }

  /* ---------- detail modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 6, 10, 0.78);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 16px 16px;
    z-index: 20;
    overflow-y: auto;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 760px;
    max-width: 100%;
    padding: 26px;
  }
  .modal h2 { font-size: 1.15rem; margin-bottom: 16px; }
  .edit-label {
    display: block;
    font-size: 0.7rem;
    color: var(--faint);
    margin: 14px 0 5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  .edit-input, .edit-area {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
    font-family: inherit;
  }
  .edit-input:focus, .edit-area:focus { border-color: var(--link); }
  .edit-area { min-height: 76px; resize: vertical; }
  .edit-orig { font-size: 0.78rem; color: var(--faint); margin-top: 4px; }
  .modal-info {
    font-size: 0.85rem;
    color: var(--muted);
    font-family: var(--mono);
    margin: 12px 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 16px;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .modal-info .k { color: var(--faint); }
  .modal-info .rel { color: var(--accent); }
  .cost-rows {
    margin: 4px 0 0;
    list-style: none;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--muted);
    border-left: 2px solid var(--border);
    padding-left: 12px;
    font-variant-numeric: tabular-nums;
  }
  .cost-rows li { margin: 3px 0; }
  .cost-rows .cv { color: var(--text); }
  .cost-note { font-size: 0.78rem; color: var(--warn); margin-top: 4px; }
  .modal-summaries {
    margin-top: 6px;
    font-size: 0.85rem;
    color: var(--muted);
    border-left: 2px solid var(--border);
    padding-left: 12px;
  }
  .modal-summaries li { margin: 5px 0 5px 14px; }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.85rem;
    padding: 7px 15px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--link); color: var(--link); }
  .btn.primary { border-color: var(--accent); background: var(--accent); color: #14100e; font-weight: 650; }
  .btn.primary:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #14100e; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .btn.warn { color: var(--warn); }
  .btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .spacer { flex: 1; }

  /* ---------- stats dashboard ---------- */
  .stats-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 25;
    overflow-y: auto;
    padding: 28px 24px;
    display: none;
  }
  .stats-overlay.open { display: block; }
  .stats-inner { max-width: 1100px; margin: 0 auto; }
  .stats-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .stats-head h2 { font-size: 1.35rem; flex: 1; }
  .stats-filters {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .stats-filters .flabel {
    font-size: 0.7rem;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-left: 10px;
  }
  .kpigrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpicard {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .kpicard .klabel { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  .kpicard .kvalue {
    font-size: 1.8rem;
    font-weight: 650;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .kpicard .ksub { font-size: 0.75rem; color: var(--faint); margin-top: 3px; }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .chart-card h3 { font-size: 0.98rem; margin-bottom: 4px; font-weight: 640; }
  .chart-card .csub { font-size: 0.78rem; color: var(--faint); margin-bottom: 14px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .legend .lkey { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .legend .lswatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .heatmap { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .hm-col { display: flex; flex-direction: column; gap: 3px; }
  .hm-cell { width: 14px; height: 14px; border-radius: 3px; background: var(--surface2); }
  .hm-scale { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 0.75rem; color: var(--faint); }
  .hm-scale .hm-cell { width: 12px; height: 12px; }
  .cols-chart { position: relative; height: 200px; margin-left: 50px; }
  .cols-grid { position: absolute; inset: 0; }
  .cols-grid .gline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border-soft); }
  .cols-grid .gtick {
    position: absolute; right: 100%;
    padding-right: 8px;
    font-size: 0.72rem;
    color: var(--faint);
    transform: translateY(-50%);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-family: var(--mono);
  }
  .cols-bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
  .col-slot { flex: 1; min-width: 3px; max-width: 26px; display: flex; flex-direction: column-reverse; height: 100%; justify-content: flex-start; }
  .col-seg { width: 100%; margin-top: 2px; }
  .col-seg:last-child { border-radius: 3px 3px 0 0; }
  .cols-x {
    margin-left: 50px;
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--faint);
    margin-top: 8px;
    font-family: var(--mono);
  }
  .hbars .hb-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .hbars .hb-name {
    width: 200px;
    font-size: 0.82rem;
    color: var(--text);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--mono);
  }
  .hbars .hb-track { flex: 1; display: flex; align-items: center; gap: 10px; }
  .hbars .hb-bar { height: 15px; border-radius: 0 3px 3px 0; background: #3987e5; min-width: 2px; }
  .hbars .hb-val {
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    font-family: var(--mono);
  }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .stats-table th {
    text-align: right;
    color: var(--faint);
    font-weight: 500;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
  }
  .stats-table th:first-child, .stats-table td:first-child { text-align: left; font-family: var(--mono); }
  .stats-table td {
    text-align: right;
    color: var(--muted);
    padding: 5px 12px;
    border-bottom: 1px solid var(--border-soft);
    font-variant-numeric: tabular-nums;
  }
  .stats-table td:first-child { color: var(--text); }
  .chart-tip {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 13px;
    font-size: 0.82rem;
    color: var(--muted);
    pointer-events: none;
    z-index: 40;
    display: none;
    max-width: 300px;
  }
  .chart-tip .tv { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- mobile ---------- */
  @media (max-width: 900px) {
    .appbody { grid-template-columns: 1fr; }
    .sidebar {
      display: none;
      position: static;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border-soft);
    }
    .sidebar.open { display: flex; }
    .filters-btn { display: inline-block; }
    .topbar { padding: 10px 12px; }
    .kpis { order: 3; width: 100%; justify-content: flex-start; }
    .feed { padding: 12px 12px 40px; }
    .card { padding: 12px 14px 10px; }
    .actions { margin-left: 0; width: 100%; justify-content: flex-end; }
    .modal-overlay { padding: 0; align-items: stretch; }
    .modal { width: 100%; border-radius: 0; min-height: 100%; }
    .hbars .hb-name { width: 110px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>window.SESSIONS_DATA = window.SESSIONS_DATA || [];</script>
<script src="sessions-data.js" onerror="console.warn('sessions-data.js not found - no sessions tracked yet')"></script>
<script src="sessions-meta.js" onerror="console.warn('sessions-meta.js not found - no local edits yet')"></script>
<script src="https://cdn.jsdelivr.net/npm/@maleta/blokjs/dist/blokjs.min.js"></script>
<script>
// ===================== shared helpers =====================

function relativeTime(dateStr) {
  if (!dateStr) return '';
  const ts = Date.parse(dateStr.replace(' ', 'T') + 'Z');
  if (isNaN(ts)) return dateStr;
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 120) return '1 minute ago';
  if (diff < 3600) return Math.floor(diff / 60) + ' minutes ago';
  if (diff < 7200) return '1 hour ago';
  if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
  if (diff < 172800) return 'yesterday';
  if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
  if (diff < 2592000) return Math.floor(diff / 604800) + ' weeks ago';
  return Math.floor(diff / 2592000) + ' months ago';
}

function formatTokens(n) {
  if (!n) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

// Timestamps are stored as UTC "YYYY-MM-DD HH:MM"; show them in local time.
function fmtExact(dateStr) {
  if (!dateStr) return '';
  const ts = Date.parse(dateStr.replace(' ', 'T') + 'Z');
  if (isNaN(ts)) return dateStr;
  const d = new Date(ts);
  const opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  const date = d.toLocaleDateString(undefined, opts);
  const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
  return date + ', ' + time;
}

function durationMinutes(startStr, endStr) {
  const a = Date.parse((startStr || '').replace(' ', 'T') + 'Z');
  const b = Date.parse((endStr || '').replace(' ', 'T') + 'Z');
  if (isNaN(a) || isNaN(b) || b <= a) return 0;
  return Math.round((b - a) / 60000);
}

function fmtDuration(min) {
  if (min < 1) return '';
  if (min < 60) return min + 'm';
  const h = Math.floor(min / 60), m = min % 60;
  if (h < 48) return h + 'h' + (m ? ' ' + m + 'm' : '');
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}

function money(v) {
  if (v >= 100) return '$' + Math.round(v).toLocaleString('en-US');
  if (v > 0 && v < 0.01) return '<$0.01';
  return '$' + v.toFixed(2);
}

// ---- API-equivalent pricing ($/1M tokens, Claude API rates as of 2026-06).
// Cache read ≈ 0.1× input, cache write ≈ 1.25× input (5-minute TTL).
// Keyed by family + version from the raw model id in the transcript.
function resolveRate(modelId) {
  const m = String(modelId).toLowerCase().match(/(opus|sonnet|haiku|fable)[-\s]?(\d+)(?:[.-](\d)(?!\d))?/);
  if (!m) return null;
  const ver = parseFloat(m[2] + '.' + (m[3] || '0'));
  if (m[1] === 'fable') return { in: 10, out: 50 };
  if (m[1] === 'opus') return ver >= 4.5 ? { in: 5, out: 25 } : { in: 15, out: 75 };
  if (m[1] === 'sonnet') return { in: 3, out: 15 };
  if (m[1] === 'haiku') return ver >= 4.5 ? { in: 1, out: 5 } : { in: 0.8, out: 4 };
  return null;
}

const FALLBACK_RATE = { in: 5, out: 25 };
const FALLBACK_NAME = 'Opus 4.8';

function modelDisplay(id) {
  const m = String(id).toLowerCase().match(/(opus|sonnet|haiku|fable)[-\s]?(\d+)(?:[.-](\d)(?!\d))?/);
  if (!m) return String(id).replace(/^claude-/, '');
  return m[1][0].toUpperCase() + m[1].slice(1) + ' ' + m[2] + (m[3] ? '.' + m[3] : '');
}

function usageCost(tk, rate) {
  return ((tk.input || 0) * rate.in + (tk.output || 0) * rate.out
    + (tk.cache_read || 0) * 0.1 * rate.in + (tk.cache_write || 0) * 1.25 * rate.in) / 1e6;
}

/**
 * Cost of one session. Uses the per-model breakdown when the session has it
 * (exact); otherwise falls back to `fallbackRate` on the totals (estimated).
 */
function sessionCostInfo(s, fallbackRate, fallbackName) {
  const rate = fallbackRate || FALLBACK_RATE;
  const entries = Object.entries(s.models || {});
  if (entries.length > 0) {
    const byName = new Map();
    for (const [id, tk] of entries) {
      const name = modelDisplay(id);
      const cur = byName.get(name) || { name, tok: 0, out: 0, cost: 0 };
      cur.tok += (tk.input || 0) + (tk.output || 0) + (tk.cache_read || 0) + (tk.cache_write || 0);
      cur.out += tk.output || 0;
      cur.cost += usageCost(tk, resolveRate(id) || rate);
      byName.set(name, cur);
    }
    const rows = Array.from(byName.values()).sort((a, b) => b.out - a.out);
    return { value: rows.reduce((sum, r) => sum + r.cost, 0), estimated: false, rows };
  }
  const tk = s.tokens || {};
  return {
    value: usageCost(tk, rate),
    estimated: true,
    rows: [{
      name: (fallbackName || FALLBACK_NAME) + ' (assumed)',
      tok: (tk.input || 0) + (tk.output || 0) + (tk.cache_read || 0) + (tk.cache_write || 0),
      out: tk.output || 0,
      cost: usageCost(tk, rate),
    }],
  };
}

function accountHue(key) {
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return h % 360;
}
function accountDotStyle(key) {
  return 'background: hsl(' + accountHue(key) + ', 55%, 60%)';
}

// ---- Search query with operators: free text + key:value terms.
const QUERY_KEYS = ['host', 'machine', 'status', 'project', 'account', 'model', 'branch', 'before', 'after'];

function parseQuery(q) {
  const ops = {}, free = [];
  for (const t of q.split(/\s+/)) {
    if (!t) continue;
    const i = t.indexOf(':');
    const key = i > 0 ? t.slice(0, i) : '';
    if (QUERY_KEYS.includes(key) && t.length > i + 1) {
      const k = key === 'machine' ? 'host' : key;
      (ops[k] = ops[k] || []).push(t.slice(i + 1));
    } else {
      free.push(t);
    }
  }
  return { ops, free };
}

function matchesQuery(s, pq) {
  for (const w of pq.free) if (!s._search.includes(w)) return false;
  for (const key in pq.ops) {
    const vals = pq.ops[key];
    if (key === 'before') {
      const d = (s.started_at || '').slice(0, 10);
      if (!d || !vals.every(v => d <= v)) return false;
      continue;
    }
    if (key === 'after') {
      const d = (s.updated_at || s.started_at || '').slice(0, 10);
      if (!d || !vals.every(v => d >= v)) return false;
      continue;
    }
    const field =
      key === 'host' ? s._host.toLowerCase() :
      key === 'status' ? (s.status || '').toLowerCase() :
      key === 'project' ? ((s.project || '') + ' ' + (s.project_path || '')).toLowerCase() :
      key === 'account' ? (s._accEmail + ' ' + s._accPlan).toLowerCase() :
      key === 'model' ? s._modelSearch :
      key === 'branch' ? (s.branch || '').toLowerCase() : '';
    if (!vals.some(v => field.includes(v))) return false;
  }
  return true;
}

// Served over http (serve.ts)? Then the resume/fork buttons open a terminal
// via POST /api/resume, and metadata (edits, archive, delete, notes) can be
// written via POST /api/meta. On file:// the UI is read-only apart from the
// legacy per-browser hide.
const SERVER_MODE = location.protocol === 'http:' || location.protocol === 'https:';

const STORAGE_KEY = 'claude-sessions-hidden';
const PREFS_KEY = 'claude-sessions-prefs';

function loadHidden() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return { sessions: [], projects: [] };
}
function saveHidden(sessions, projects) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ sessions, projects }));
}
function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return {};
}
function savePrefs(prefs) {
  localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
}

function postMeta(id, patch) {
  return fetch('/api/meta', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-session-tracker': '1' },
    body: JSON.stringify({ id, patch }),
  }).then(r => r.json());
}

let _debounceTimer = null;

// Pre-process sessions: apply the metadata overlay (user edits win over the
// hook's analysis), build search index + every derived display field.
function buildSessions(rawList) {
  return (rawList || [])
    .map(s => ({
      ...s,
      started_at: s.started_at || s.date || '',
      updated_at: s.updated_at || s.date || '',
    }))
    .map(s => {
      const tk = s.tokens || { input: 0, output: 0, cache_write: 0, cache_read: 0 };
      const acc = s.account || null;
      const m = s.meta || (window.SESSIONS_META && window.SESSIONS_META[s.id]) || {};
      const title = m.title || s.title;
      const summary = m.summary || s.summary;
      const topics = m.topics || s.topics || '';
      const status = m.status || s.status;
      const cost = sessionCostInfo(s);
      const durMin = durationMinutes(s.started_at, s.updated_at);
      const tokTotal = (tk.input || 0) + (tk.output || 0) + (tk.cache_write || 0) + (tk.cache_read || 0);
      const modelNames = cost.estimated ? [] : cost.rows.map(r => r.name);
      return {
        ...s,
        title, summary, topics, status,
        summaries: s.summaries || [],
        _orig: { title: s.title, summary: s.summary, topics: s.topics || '', status: s.status },
        _note: m.note || '',
        _pinned: !!m.pinned,
        _archived: !!m.archived,
        _deleted: !!m.deleted,
        _host: s.host || '',
        _hostDotStyle: accountDotStyle('host:' + (s.host || '')),
        _accKey: (acc && acc.email) || '',
        _accEmail: (acc && acc.email) || 'untracked account',
        _accPlan: (acc && acc.plan) || '',
        _accChipLabel: (acc && (acc.plan || acc.email)) || 'untracked',
        _accDotStyle: accountDotStyle((acc && acc.email) || ''),
        _search: [title, summary, topics, s.project, s.project_path, s.host || '', m.note || '',
          s.branch || '', modelNames.join(' '), (acc && acc.email) || '', (acc && acc.plan) || '']
          .join('\0').toLowerCase(),
        _topics: topics.split(',').map(t => t.trim()).filter(Boolean),
        _pillClass: 'pill pill-' + status,
        _msgLabel: s.messages + ' msgs',
        _endPrefix: s.updated_at && s.updated_at !== s.started_at ? (status === 'completed' ? 'end' : 'last') : '',
        _isHidden: false,
        _costNum: cost.value,
        _costLabel: (cost.estimated ? '~' : '') + money(cost.value),
        _costEstimated: cost.estimated,
        _costRows: cost.rows.map(r => ({
          name: r.name,
          tokLabel: formatTokens(r.tok) + ' tok',
          costLabel: money(r.cost),
        })),
        _costTitle: cost.estimated
          ? 'estimated at ' + FALLBACK_NAME + ' rates (no per-model data;\nrun backfill --update-tokens to fix)'
          : cost.rows.map(r => r.name + ': ' + formatTokens(r.tok) + ' tok · ' + money(r.cost)).join('\n'),
        _modelLabel: modelNames[0] || '',
        _modelExtra: modelNames.length > 1 ? '+' + (modelNames.length - 1) : '',
        _modelTitle: modelNames.join('\n'),
        _modelSearch: (modelNames.join(' ') + ' ' + Object.keys(s.models || {}).join(' ')).toLowerCase(),
        _durMin: durMin,
        _durLabel: fmtDuration(durMin),
        _tokTotal: tokTotal,
        _tokTotalLabel: ' · ' + formatTokens(tokTotal) + ' tok',
        _tokTitle:
          'regular: ' + (tk.input || 0).toLocaleString() + ' in / ' + (tk.output || 0).toLocaleString() + ' out\n' +
          'cached: ' + (tk.cache_read || 0).toLocaleString() + ' read / ' + (tk.cache_write || 0).toLocaleString() + ' write',
      };
    });
}

async function loadConfig() {
  if (!SERVER_MODE) return {};
  try {
    const r = await fetch('/api/config');
    return r.ok ? await r.json() : {};
  } catch (e) {
    return {};
  }
}

async function fetchSessions() {
  const r = await fetch('/api/sessions');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}

// One-time migration: hides stored in this browser's localStorage become
// synced "archived" metadata once a server with editing is available.
async function migrateLocalHidden(rawList, canEdit) {
  const stored = loadHidden();
  if (!canEdit || (!stored.sessions.length && !stored.projects.length)) return rawList;
  const ids = new Set(stored.sessions);
  const projects = new Set(stored.projects);
  let migrated = 0;
  for (const s of rawList) {
    const m = s.meta || {};
    if (m.archived) continue;
    if (ids.has(s.id) || projects.has(s.project_path) || projects.has(s.project)) {
      try { await postMeta(s.id, { archived: true }); migrated++; } catch (e) { return rawList; }
    }
  }
  localStorage.removeItem(STORAGE_KEY);
  if (!migrated) return rawList;
  try { return await fetchSessions(); } catch (e) { return rawList; }
}

loadConfig().then(async cfg => {
const canEdit = SERVER_MODE && !!cfg.edit;
let initialRaw = window.SESSIONS_DATA || [];
try { initialRaw = await migrateLocalHidden(initialRaw, canEdit); } catch (e) { /* keep initial */ }
const stored = loadHidden();
const prefs = loadPrefs();

const app = blok.mount('#app', {
  state: {
    sessions: buildSessions(initialRaw),
    searchInput: '',
    search: '',
    showToast: false,
    toastMsg: '',
    showArchived: false,
    showDeleted: false,
    showAllProjects: false,
    showFilters: false,
    hiddenSessionIds: stored.sessions,
    hiddenProjectPaths: stored.projects,
    projectFilter: '__all__',
    accountFilter: '__all__',
    hostFilter: '__all__',
    statusFilter: '__all__',
    sortKey: prefs.sort || 'recent',
    density: prefs.density || 'comfortable',
    canResume: !!cfg.resume,
    canEdit: canEdit,
    serverHost: cfg.host || '',
    remotes: cfg.remotes || {},
    detailId: '',
    pendingDelete: false,
    editTitle: '',
    editSummary: '',
    editTopics: '',
    editStatus: '',
    editNote: '',
    editPinned: false,
    tick: 0,
  },

  watch: {
    searchInput(val) {
      clearTimeout(_debounceTimer);
      _debounceTimer = setTimeout(() => { this.search = val; }, 200);
    },
  },

  computed: {
    filtered() {
      const q = this.search.trim().toLowerCase();
      let result = this.sessions;
      if (!this.showDeleted) result = result.filter(s => !s._deleted);
      if (!this.showArchived) result = result.filter(s => !s._archived);
      if (this.projectFilter !== '__all__') {
        result = result.filter(s => (s.project || s.project_path || 'unknown') === this.projectFilter);
      }
      if (this.accountFilter !== '__all__') {
        result = result.filter(s => s._accKey === this.accountFilter);
      }
      if (this.hostFilter !== '__all__') {
        result = result.filter(s => s._host === this.hostFilter);
      }
      if (this.statusFilter !== '__all__') {
        result = result.filter(s => s.status === this.statusFilter);
      }
      if (q) {
        const pq = parseQuery(q);
        result = result.filter(s => matchesQuery(s, pq));
      }
      if (this.canEdit) return result;
      // Legacy per-browser hide (file:// or no-edit servers only)
      const hiddenIds = new Set(this.hiddenSessionIds);
      const hiddenPaths = new Set(this.hiddenProjectPaths);
      if (this.showArchived) return result;
      return result.filter(s =>
        !hiddenIds.has(s.id) && !hiddenPaths.has(s.project_path) && !hiddenPaths.has(s.project)
      );
    },
    feed() {
      void this.tick;
      const arr = [...this.filtered];
      const k = this.sortKey;
      if (k === 'cost') arr.sort((a, b) => b._costNum - a._costNum);
      else if (k === 'tokens') arr.sort((a, b) => b._tokTotal - a._tokTotal);
      else if (k === 'duration') arr.sort((a, b) => b._durMin - a._durMin);
      else arr.sort((a, b) =>
        ((b._pinned ? 1 : 0) - (a._pinned ? 1 : 0)) ||
        (b.updated_at || b.started_at).localeCompare(a.updated_at || a.started_at));
      const hiddenIds = new Set(this.hiddenSessionIds);
      for (const s of arr) {
        s._isHidden = s._archived || (!this.canEdit && hiddenIds.has(s.id));
        s._startText = fmtExact(s.started_at);
        s._endText = s._endPrefix ? fmtExact(s.updated_at) : '';
        s._endRelText = ' · ' + relativeTime(s.updated_at);
        s._startRelText = relativeTime(s.started_at);
        s._endPrefixLabel = s._endPrefix + ' ';
        s._startTitle = s.started_at + ' UTC';
        s._endTitle = s.updated_at + ' UTC';
      }
      return arr;
    },
    projectFacets() {
      const map = new Map();
      for (const s of this.sessions) {
        if (s._deleted) continue;
        const key = s.project || s.project_path || 'unknown';
        map.set(key, (map.get(key) || 0) + 1);
      }
      const all = Array.from(map, ([key, count]) => ({
        key, count,
        active: key === this.projectFilter,
      })).sort((a, b) => b.count - a.count || a.key.localeCompare(b.key));
      return this.showAllProjects ? all : all.slice(0, 12);
    },
    projectsMoreText() {
      const total = new Set(this.sessions.filter(s => !s._deleted)
        .map(s => s.project || s.project_path || 'unknown')).size;
      if (total <= 12) return '';
      return this.showAllProjects ? 'show fewer' : '+ ' + (total - 12) + ' more';
    },
    accounts() {
      const map = new Map();
      for (const s of this.sessions) {
        if (s._deleted) continue;
        if (!map.has(s._accKey)) {
          map.set(s._accKey, { key: s._accKey, email: s._accEmail, plan: s._accPlan, dotStyle: s._accDotStyle, count: 0 });
        }
        map.get(s._accKey).count++;
      }
      if (map.size < 2) return [];
      return Array.from(map.values()).sort((a, b) => b.count - a.count)
        .map(a => ({ ...a, active: a.key === this.accountFilter }));
    },
    hosts() {
      const map = new Map();
      for (const s of this.sessions) {
        if (s._deleted) continue;
        if (!map.has(s._host)) {
          map.set(s._host, { key: s._host, name: s._host || 'unknown host', dotStyle: s._hostDotStyle, count: 0 });
        }
        map.get(s._host).count++;
      }
      if (map.size < 2) return [];
      return Array.from(map.values()).sort((a, b) => b.count - a.count)
        .map(h => ({ ...h, active: h.key === this.hostFilter }));
    },
    statuses() {
      const map = new Map();
      for (const s of this.sessions) {
        if (s._deleted || s._archived) continue;
        map.set(s.status, (map.get(s.status) || 0) + 1);
      }
      if (map.size < 2) return [];
      return Array.from(map, ([key, count]) => ({
        key, count,
        dotStyle: 'background: ' + (key === 'completed' ? 'var(--ok)' : key === 'in-progress' ? 'var(--warn)'
          : key === 'debugging' ? 'var(--err)' : 'var(--info)'),
        active: key === this.statusFilter,
      })).sort((a, b) => b.count - a.count);
    },
    kpis() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const weekStart = now.getTime() - 7 * 86400000;
      let todayCount = 0, todayCost = 0, weekCost = 0;
      for (const s of this.sessions) {
        if (s._deleted) continue;
        const ts = Date.parse((s.updated_at || s.started_at).replace(' ', 'T') + 'Z');
        if (isNaN(ts)) continue;
        if (ts >= todayStart) { todayCount++; todayCost += s._costNum; }
        if (ts >= weekStart) { weekCost += s._costNum; }
      }
      return [
        { key: 'today', value: String(todayCount), label: 'today' },
        { key: 'tcost', value: money(todayCost), label: '$ today' },
        { key: 'wcost', value: money(weekCost), label: '$ 7 days' },
      ];
    },
    sortOptions() {
      return [
        { key: 'recent', label: 'recent' },
        { key: 'cost', label: 'cost' },
        { key: 'tokens', label: 'tokens' },
        { key: 'duration', label: 'duration' },
      ].map(o => ({ ...o, active: o.key === this.sortKey }));
    },
    isCompact() {
      return this.density === 'compact';
    },
    densityBtnText() {
      return this.density === 'compact' ? 'density: compact' : 'density: comfortable';
    },
    archivedCount() {
      if (this.canEdit) return this.sessions.filter(s => s._archived && !s._deleted).length;
      return this.hiddenSessionIds.length + this.hiddenProjectPaths.length;
    },
    deletedCount() {
      return this.sessions.filter(s => s._deleted).length;
    },
    detail() {
      if (!this.detailId) return null;
      return this.sessions.find(s => s.id === this.detailId) || null;
    },
    detailOpen() {
      return !!this.detail;
    },
    detailStartText() {
      return this.detail ? fmtExact(this.detail.started_at) : '';
    },
    detailEndText() {
      return this.detail ? fmtExact(this.detail.updated_at) : '';
    },
    detailEndRel() {
      return this.detail ? ' · ' + relativeTime(this.detail.updated_at) : '';
    },
    archiveBtnText() {
      return this.detail && this.detail._archived ? 'Unarchive' : 'Archive';
    },
    deleteBtnText() {
      return this.pendingDelete ? 'Confirm delete?' : 'Delete';
    },
    origTitleHint() {
      const d = this.detail;
      return d && d.title !== d._orig.title ? 'original: ' + d._orig.title : '';
    },
    editStatuses() {
      return ['completed', 'in-progress', 'exploring', 'debugging'].map(k => ({
        key: k,
        active: this.editStatus === k,
      }));
    },
    statsText() {
      const list = this.filtered;
      const projects = new Set(list.map(s => s.project || s.project_path || 'unknown')).size;
      return list.length + ' session' + (list.length !== 1 ? 's' : '') + (this.search ? ' matching' : '') +
        ' · ' + projects + ' project' + (projects !== 1 ? 's' : '');
    },
    tokensText() {
      let tok = 0, cost = 0;
      for (const s of this.filtered) {
        tok += s._tokTotal;
        cost += s._costNum;
      }
      return formatTokens(tok) + ' tok · ' + money(cost);
    },
    archivedBtnText() {
      return (this.showArchived ? 'hide' : 'show') + ' archived (' + this.archivedCount + ')';
    },
    deletedBtnText() {
      return (this.showDeleted ? 'hide' : 'show') + ' deleted (' + this.deletedCount + ')';
    },
  },

  methods: {
    toggleArchived() { this.showArchived = !this.showArchived; },
    toggleDeleted() { this.showDeleted = !this.showDeleted; },
    toggleAllProjects() { this.showAllProjects = !this.showAllProjects; },
    toggleFilters() { this.showFilters = !this.showFilters; },
    setProject(key) {
      this.projectFilter = this.projectFilter === key ? '__all__' : key;
    },
    setProjectFromCard(s) {
      this.projectFilter = s.project || s.project_path || 'unknown';
    },
    setAccount(key) {
      this.accountFilter = this.accountFilter === key ? '__all__' : key;
    },
    setHost(key) {
      this.hostFilter = this.hostFilter === key ? '__all__' : key;
    },
    setStatus(key) {
      this.statusFilter = this.statusFilter === key ? '__all__' : key;
    },
    setSort(key) {
      this.sortKey = key;
      savePrefs({ sort: this.sortKey, density: this.density });
    },
    toggleDensity() {
      this.density = this.density === 'compact' ? 'comfortable' : 'compact';
      savePrefs({ sort: this.sortKey, density: this.density });
    },
    setEditStatus(key) { this.editStatus = key; },
    noop() { /* click.stop anchor for the modal panel */ },
    openStats() {
      if (window.__openStats) window.__openStats();
    },
    _toast(msg, ms) {
      this.toastMsg = msg;
      this.showToast = true;
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => { this.showToast = false; }, ms || 1500);
    },
    async reloadData() {
      try {
        const raw = await fetchSessions();
        this.sessions = buildSessions(raw);
      } catch (e) {
        this._toast('Reload failed: ' + e.message, 3000);
      }
    },
    async _patch(id, patch, okMsg) {
      try {
        const res = await postMeta(id, patch);
        if (res.ok) {
          if (okMsg) this._toast(okMsg);
          await this.reloadData();
        } else {
          this._toast('Error: ' + (res.error || 'unknown'), 3500);
        }
      } catch (e) {
        this._toast('Server error: ' + e.message, 3500);
      }
    },
    hideSession(id) {
      if (this.canEdit) {
        this._patch(id, { archived: true }, 'Archived');
        return;
      }
      if (this.hiddenSessionIds.includes(id)) return;
      this.hiddenSessionIds = [...this.hiddenSessionIds, id];
      saveHidden(this.hiddenSessionIds, this.hiddenProjectPaths);
    },
    restoreSession(id) {
      if (this.canEdit) {
        this._patch(id, { archived: null }, 'Restored');
        return;
      }
      this.hiddenSessionIds = this.hiddenSessionIds.filter(x => x !== id);
      saveHidden(this.hiddenSessionIds, this.hiddenProjectPaths);
    },
    async archiveProject(key) {
      if (this.canEdit) {
        for (const s of this.sessions) {
          if (s._deleted || s._archived) continue;
          if ((s.project || s.project_path || 'unknown') !== key) continue;
          await postMeta(s.id, { archived: true }).catch(() => {});
        }
        this._toast('Project archived');
        await this.reloadData();
        return;
      }
      if (this.hiddenProjectPaths.includes(key)) return;
      this.hiddenProjectPaths = [...this.hiddenProjectPaths, key];
      saveHidden(this.hiddenSessionIds, this.hiddenProjectPaths);
    },
    openDetail(s) {
      this.detailId = s.id;
      this.pendingDelete = false;
      this.editTitle = s.title;
      this.editSummary = s.summary;
      this.editTopics = s.topics;
      this.editStatus = s.status;
      this.editNote = s._note;
      this.editPinned = s._pinned;
    },
    closeDetail() {
      this.detailId = '';
      this.pendingDelete = false;
    },
    togglePin() { this.editPinned = !this.editPinned; },
    async saveDetail() {
      const s = this.detail;
      if (!s || !this.canEdit) return;
      const patch = {};
      patch.title = this.editTitle !== s._orig.title ? this.editTitle : null;
      patch.summary = this.editSummary !== s._orig.summary ? this.editSummary : null;
      patch.topics = this.editTopics !== s._orig.topics ? this.editTopics : null;
      patch.status = this.editStatus !== s._orig.status ? this.editStatus : null;
      patch.note = this.editNote || null;
      patch.pinned = this.editPinned || null;
      await this._patch(s.id, patch, 'Saved');
      this.closeDetail();
    },
    async archiveFromDetail() {
      const s = this.detail;
      if (!s) return;
      await this._patch(s.id, { archived: s._archived ? null : true }, s._archived ? 'Restored' : 'Archived');
      this.closeDetail();
    },
    async deleteFromDetail() {
      const s = this.detail;
      if (!s) return;
      if (!this.pendingDelete) {
        this.pendingDelete = true;
        this._toast('Click again to confirm delete', 2500);
        return;
      }
      await this._patch(s.id, { deleted: true }, 'Deleted (restorable via "show deleted")');
      this.closeDetail();
    },
    async restoreDeleted(id) {
      await this._patch(id, { deleted: null }, 'Restored');
    },
    _isRemote(s) {
      return !!(s._host && this.serverHost && s._host !== this.serverHost);
    },
    _copy(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => this._fallbackCopy(text));
      } else {
        this._fallbackCopy(text);
      }
    },
    _copyRemote(s, fork) {
      const remote = this.remotes[s._host] || {};
      const cmd = remote.command
        ? remote.command
            .replaceAll('{id}', s.id)
            .replaceAll('{path}', s.project_path || '')
            .replaceAll('{project}', s.project || '')
        : 'claude --resume ' + s.id + (fork ? ' --fork-session' : '');
      this._copy(cmd);
      this._toast('Session from "' + (remote.label || s._host) + '" - command copied', 2500);
    },
    async _launch(s, fork) {
      if (!this.canResume) return;
      if (this._isRemote(s)) {
        // Can't open a terminal on another machine - hand over the command
        this._copyRemote(s, fork);
        return;
      }
      this._toast('Opening terminal…', 2500);
      try {
        const res = await fetch('/api/resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-session-tracker': '1' },
          body: JSON.stringify(fork ? { id: s.id, fork: true } : { id: s.id }),
        });
        const data = await res.json().catch(() => ({}));
        if (data.ok) {
          this._toast((fork ? 'Forking in ' : 'Resuming in ') + data.terminal + '…', 2500);
        } else {
          this._toast('Error: ' + (data.error || res.status), 3500);
        }
      } catch (e) {
        this._toast('Server error: ' + e.message, 3500);
      }
    },
    resumeSession(s) { return this._launch(s, false); },
    forkSession(s) { return this._launch(s, true); },
    copyResume(session) {
      // For sessions from another machine with a configured remote command,
      // copy that instead of a local cd that wouldn't exist here.
      if (this._isRemote(session) && this.remotes[session._host]) {
        this._copyRemote(session, false);
        return;
      }
      const cmd = 'cd ' + session.project_path + ' && claude --resume ' + session.id;
      this._copy(cmd);
      this._toast('Copied to clipboard!');
    },
    copyId() {
      const s = this.detail;
      if (!s) return;
      this._copy(s.id);
      this._toast('Session id copied');
    },
    _fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    },
  },

// (new sessions and edits made from other browsers/machines appear alone).
try {
  if (app && typeof app.tick === 'number') {
    setInterval(() => {
      app.tick++;
      if (SERVER_MODE && typeof app.reloadData === 'function' && !app.detailOpen) {
        app.reloadData();
      }
    }, 60000);
  }
} catch (e) { /* ignore */ }
});

// ===================== Usage dashboard (vanilla DOM) =====================
// Rendered outside blok into its own overlay. Palette validated with the
// dataviz six-checks validator against surface #10151c (dark):
//   categorical (machines): #3987e5 #199e70 #c98500  (worst adjacent CVD ΔE 41.3)
//   sequential heatmap ramp: #184f95 #256abf #3987e5 #6da7ec #9ec5f4 (monotone L)
(function () {
  const SERIES = ['#3987e5', '#199e70', '#c98500'];
  const OTHER_COLOR = '#94a1b1';
  const RAMP = ['#171e27', '#184f95', '#256abf', '#3987e5', '#6da7ec', '#9ec5f4'];

  // Fallback rates for sessions WITHOUT a per-model breakdown (imported
  // before model tracking). Sessions with `models` use exact per-model rates.
  const PRICES = {
    'Fable 5':   { in: 10, out: 50 },
    'Opus 4.8':  { in: 5,  out: 25 },
    'Sonnet 5':  { in: 3,  out: 15 },
    'Haiku 4.5': { in: 1,  out: 5 },
  };

  const state = { range: 30, model: 'Opus 4.8', sessions: [] };
  let overlay = null, tip = null;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function dayKey(d) {
    return d.toISOString().slice(0, 10);
  }

  async function getSessions() {
    if (SERVER_MODE) {
      try { return await fetchSessions(); } catch (e) { /* fall through */ }
    }
    return window.SESSIONS_DATA || [];
  }

  function showTip(evt, lines) {
    tip.replaceChildren();
    for (const [label, value] of lines) {
      const row = el('div');
      if (value === undefined) {
        row.textContent = label;
      } else {
        const v = el('span', 'tv', value);
        row.append(v, ' ', label);
      }
      tip.append(row);
    }
    tip.style.display = 'block';
    const x = Math.min(evt.clientX + 14, window.innerWidth - 300);
    tip.style.left = x + 'px';
    tip.style.top = (evt.clientY + 14) + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }
  function hover(node, linesFn) {
    node.addEventListener('pointermove', e => showTip(e, linesFn()));
    node.addEventListener('pointerleave', hideTip);
  }

  function aggregate(sessions, days, p) {
    const now = new Date();
    const from = new Date(now); from.setDate(from.getDate() - (days - 1));
    const fromKey = days === Infinity ? '' : dayKey(from);
    const live = sessions.filter(s => !(s.meta && s.meta.deleted));
    const inRange = live.filter(s => (s.started_at || '').slice(0, 10) >= fromKey);
    const byDay = new Map();
    const byProject = new Map();
    const byModel = new Map();
    const hosts = new Map();
    const total = { input: 0, output: 0, cache_read: 0, cache_write: 0 };
    let totalCost = 0;
    let exact = 0;
    for (const s of inRange) {
      const day = (s.started_at || '').slice(0, 10);
      if (!day) continue;
      const tk = s.tokens || { input: 0, output: 0, cache_read: 0, cache_write: 0 };
      const host = s.host || 'unknown';
      const sCost = sessionCostInfo(s, p, state.model);
      totalCost += sCost.value;
      if (!sCost.estimated) exact++;
      if (!byDay.has(day)) byDay.set(day, { sessions: 0, out: 0, total: 0, cost: 0, byHost: new Map() });
      const d = byDay.get(day);
      d.sessions++; d.out += tk.output; d.total += tk.input + tk.output + tk.cache_read + tk.cache_write;
      d.cost += sCost.value;
      d.byHost.set(host, (d.byHost.get(host) || 0) + tk.output);
      const proj = s.project || 'unknown';
      if (!byProject.has(proj)) byProject.set(proj, { sessions: 0, input: 0, output: 0, cache_read: 0, cache_write: 0, cost: 0 });
      const P = byProject.get(proj);
      P.sessions++; P.input += tk.input; P.output += tk.output; P.cache_read += tk.cache_read; P.cache_write += tk.cache_write;
      P.cost += sCost.value;
      for (const row of sCost.rows) {
        const name = row.name;
        if (!byModel.has(name)) byModel.set(name, { sessions: 0, out: 0, tok: 0, cost: 0 });
        const M = byModel.get(name);
        M.sessions++; M.out += row.out; M.tok += row.tok; M.cost += row.cost;
      }
      hosts.set(host, (hosts.get(host) || 0) + tk.output);
      total.input += tk.input; total.output += tk.output; total.cache_read += tk.cache_read; total.cache_write += tk.cache_write;
    }
    const hostOrder = Array.from(hosts.keys()).sort();
    return { inRange, byDay, byProject, byModel, hostOrder, total, totalCost, exact };
  }

  function hostColor(host, hostOrder) {
    const i = hostOrder.indexOf(host);
    return i >= 0 && i < SERIES.length ? SERIES[i] : OTHER_COLOR;
  }

  function render() {
    const inner = overlay.querySelector('.stats-inner');
    inner.replaceChildren();
    const days = state.range;
    const p = PRICES[state.model];
    const agg = aggregate(state.sessions, days, p);

    // -- Head + filters --
    const head = el('div', 'stats-head');
    head.append(el('h2', null, 'Usage dashboard'));
    const close = el('button', 'btn', 'Close');
    close.addEventListener('click', closeStats);
    head.append(close);
    inner.append(head);

    const filters = el('div', 'stats-filters');
    filters.append(el('span', 'flabel', 'Range'));
    for (const [label, value] of [['7d', 7], ['30d', 30], ['90d', 90], ['all', Infinity]]) {
      const b = el('button', 'tool-chip' + (state.range === value ? ' active' : ''), label);
      b.addEventListener('click', () => { state.range = value; render(); });
      filters.append(b);
    }
    filters.append(el('span', 'flabel', 'fallback $'));
    for (const name of Object.keys(PRICES)) {
      const b = el('button', 'tool-chip' + (state.model === name ? ' active' : ''), name);
      b.title = 'Rate used only for sessions without per-model data';
      b.addEventListener('click', () => { state.model = name; render(); });
      filters.append(b);
    }
    inner.append(filters);

    // -- KPI row --
    const kpis = el('div', 'kpigrid');
    const kpi = (label, value, sub) => {
      const k = el('div', 'kpicard');
      k.append(el('div', 'klabel', label));
      k.append(el('div', 'kvalue', value));
      if (sub) k.append(el('div', 'ksub', sub));
      return k;
    };
    const t = agg.total;
    const estCount = agg.inRange.length - agg.exact;
    kpis.append(kpi('Sessions', String(agg.inRange.length), 'archived included, deleted excluded'));
    kpis.append(kpi('Tokens generated', formatTokens(t.output), formatTokens(t.input) + ' in (regular)'));
    kpis.append(kpi('Cache read', formatTokens(t.cache_read), formatTokens(t.cache_write) + ' written'));
    kpis.append(kpi('API-equivalent value', money(agg.totalCost),
      estCount > 0
        ? estCount + ' session' + (estCount !== 1 ? 's' : '') + ' estimated at ' + state.model + ' rates'
        : 'exact per-model rates, 5m cache TTL'));
    inner.append(kpis);

    // -- Activity heatmap --
    const hmCard = el('div', 'chart-card');
    hmCard.append(el('h3', null, 'Activity'));
    const capped = days === Infinity;
    const hmDays = Math.min(days === Infinity ? 364 : days, 364);
    hmCard.append(el('div', 'csub', 'sessions per day' + (capped ? ' · showing last 52 weeks' : '')));
    const hm = el('div', 'heatmap');
    const today = new Date();
    const start = new Date(today); start.setDate(start.getDate() - (hmDays - 1));
    // align to Monday
    const dow = (start.getDay() + 6) % 7;
    start.setDate(start.getDate() - dow);
    let maxDay = 1;
    for (const d of agg.byDay.values()) maxDay = Math.max(maxDay, d.sessions);
    const thresholds = [1, Math.ceil(maxDay * 0.25), Math.ceil(maxDay * 0.5), Math.ceil(maxDay * 0.75), maxDay];
    const level = n => {
      if (!n) return 0;
      for (let i = 1; i < 5; i++) if (n <= thresholds[i]) return i;
      return 5;
    };
    for (let c = new Date(start); c <= today;) {
      const col = el('div', 'hm-col');
      for (let r = 0; r < 7 && c <= today; r++) {
        const key = dayKey(c);
        const d = agg.byDay.get(key);
        const cell = el('div', 'hm-cell');
        cell.style.background = RAMP[level(d ? d.sessions : 0)];
        const kd = key, dd = d;
        hover(cell, () => dd
          ? [[kd], [' sessions', String(dd.sessions)], [' tokens (all)', formatTokens(dd.total)], [' ≈ value', money(dd.cost)]]
          : [[kd], ['no sessions']]);
        col.append(cell);
        c.setDate(c.getDate() + 1);
      }
      hm.append(col);
    }
    hmCard.append(hm);
    const scale = el('div', 'hm-scale');
    scale.append(el('span', null, 'less'));
    for (const color of RAMP) {
      const sw = el('span', 'hm-cell'); sw.style.background = color; scale.append(sw);
    }
    scale.append(el('span', null, 'more'));
    hmCard.append(scale);
    inner.append(hmCard);

    // -- Tokens per day, stacked by machine --
    const dcCard = el('div', 'chart-card');
    dcCard.append(el('h3', null, 'Tokens generated per day'));
    dcCard.append(el('div', 'csub', 'output tokens, stacked by machine'));
    if (agg.hostOrder.length > 1) {
      const legend = el('div', 'legend');
      for (const h of agg.hostOrder) {
        const key = el('span', 'lkey');
        const sw = el('span', 'lswatch'); sw.style.background = hostColor(h, agg.hostOrder);
        key.append(sw, h);
        legend.append(key);
      }
      dcCard.append(legend);
    }
    const chartDays = Math.min(days === Infinity ? 90 : days, 90);
    const dayList = [];
    for (let i = chartDays - 1; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      dayList.push(dayKey(d));
    }
    let maxOut = 1;
    for (const key of dayList) {
      const d = agg.byDay.get(key);
      if (d) maxOut = Math.max(maxOut, d.out);
    }
    const chart = el('div', 'cols-chart');
    const grid = el('div', 'cols-grid');
    const step = niceStep(maxOut);
    for (let v = 0; v <= maxOut; v += step) {
      const y = 100 - (v / maxOut) * 100;
      const line = el('div', 'gline'); line.style.top = y + '%';
      grid.append(line);
      const tick = el('span', 'gtick', formatTokens(v)); tick.style.top = y + '%';
      grid.append(tick);
    }
    chart.append(grid);
    const bars = el('div', 'cols-bars');
    for (const key of dayList) {
      const slot = el('div', 'col-slot');
      const d = agg.byDay.get(key);
      if (d) {
        for (const h of agg.hostOrder) {
          const v = d.byHost.get(h) || 0;
          if (!v) continue;
          const seg = el('div', 'col-seg');
          seg.style.height = 'calc(' + ((v / maxOut) * 100) + '% - 2px)';
          seg.style.background = hostColor(h, agg.hostOrder);
          slot.append(seg);
        }
      }
      const kd = key, dd = d;
      hover(slot, () => {
        const lines = [[kd]];
        if (dd) {
          for (const h of agg.hostOrder) {
            const v = dd.byHost.get(h) || 0;
            if (v) lines.push([' out · ' + h, formatTokens(v)]);
          }
          lines.push([' sessions', String(dd.sessions)]);
          lines.push([' ≈ value', money(dd.cost)]);
        } else {
          lines.push(['no sessions']);
        }
        return lines;
      });
      bars.append(slot);
    }
    chart.append(bars);
    dcCard.append(chart);
    const xAxis = el('div', 'cols-x');
    xAxis.append(el('span', null, dayList[0]));
    xAxis.append(el('span', null, dayList[dayList.length - 1]));
    dcCard.append(xAxis);
    if (days === Infinity && chartDays === 90) {
      dcCard.append(el('div', 'csub', 'daily chart capped at last 90 days (heatmap and totals cover the full range)'));
    }
    inner.append(dcCard);

    // -- By model --
    if (agg.byModel.size > 0) {
      const bmCard = el('div', 'chart-card hbars');
      bmCard.append(el('h3', null, 'By model'));
      bmCard.append(el('div', 'csub', 'output tokens and API-equivalent value in range'));
      const models = Array.from(agg.byModel, ([name, v]) => ({ name, ...v }))
        .sort((a, b) => b.out - a.out);
      const maxModel = Math.max(1, ...models.map(x => x.out));
      for (const mrow of models) {
        const row = el('div', 'hb-row');
        row.append(el('div', 'hb-name', mrow.name));
        const track = el('div', 'hb-track');
        const bar = el('div', 'hb-bar');
        bar.style.width = ((mrow.out / maxModel) * 100) + '%';
        if (mrow.name.includes('(assumed)')) bar.style.background = OTHER_COLOR;
        track.append(bar);
        track.append(el('span', 'hb-val', formatTokens(mrow.out) + ' out · ' + money(mrow.cost)));
        const mr = mrow;
        hover(row, () => [[mr.name], [' sessions', String(mr.sessions)], [' out', formatTokens(mr.out)],
          [' tokens (all)', formatTokens(mr.tok)], [' ≈ value', money(mr.cost)]]);
        row.append(track);
        bmCard.append(row);
      }
      inner.append(bmCard);
    }

    // -- Top projects --
    const tpCard = el('div', 'chart-card hbars');
    tpCard.append(el('h3', null, 'Top projects'));
    tpCard.append(el('div', 'csub', 'output tokens in range'));
    const projects = Array.from(agg.byProject, ([name, v]) => ({ name, ...v }))
      .sort((a, b) => b.output - a.output);
    const top = projects.slice(0, 8);
    const rest = projects.slice(8);
    if (rest.length) {
      const other = { name: 'other (' + rest.length + ' projects)', sessions: 0, input: 0, output: 0, cache_read: 0, cache_write: 0, cost: 0 };
      for (const r of rest) {
        other.sessions += r.sessions; other.input += r.input; other.output += r.output;
        other.cache_read += r.cache_read; other.cache_write += r.cache_write; other.cost += r.cost;
      }
      top.push(other);
    }
    const maxProj = Math.max(1, ...top.map(x => x.output));
    for (const proj of top) {
      const row = el('div', 'hb-row');
      row.append(el('div', 'hb-name', proj.name));
      const track = el('div', 'hb-track');
      const bar = el('div', 'hb-bar');
      bar.style.width = ((proj.output / maxProj) * 100) + '%';
      if (proj.name.startsWith('other (')) bar.style.background = OTHER_COLOR;
      track.append(bar);
      track.append(el('span', 'hb-val', formatTokens(proj.output) + ' · ' + money(proj.cost)));
      const pr = proj;
      hover(row, () => [[pr.name], [' sessions', String(pr.sessions)], [' out', formatTokens(pr.output)],
        [' cache read', formatTokens(pr.cache_read)], [' ≈ value', money(pr.cost)]]);
      row.append(track);
      tpCard.append(row);
    }
    inner.append(tpCard);

    // -- Table view (accessibility twin) --
    const tblCard = el('div', 'chart-card');
    tblCard.append(el('h3', null, 'By project (table)'));
    const table = el('table', 'stats-table');
    const thead = el('thead');
    const hr = el('tr');
    for (const h of ['project', 'sessions', 'in', 'out', 'cache read', 'cache write', '≈ value']) hr.append(el('th', null, h));
    thead.append(hr); table.append(thead);
    const tbody = el('tbody');
    for (const proj of projects) {
      const tr = el('tr');
      tr.append(el('td', null, proj.name));
      tr.append(el('td', null, String(proj.sessions)));
      tr.append(el('td', null, formatTokens(proj.input)));
      tr.append(el('td', null, formatTokens(proj.output)));
      tr.append(el('td', null, formatTokens(proj.cache_read)));
      tr.append(el('td', null, formatTokens(proj.cache_write)));
      tr.append(el('td', null, money(proj.cost)));
      tbody.append(tr);
    }
    table.append(tbody);
    tblCard.append(table);
    inner.append(tblCard);
  }

  function niceStep(max) {
    const raw = max / 4;
    const pow = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 5, 10]) {
      if (raw <= m * pow) return m * pow;
    }
    return 10 * pow;
  }

  function closeStats() {
    overlay.classList.remove('open');
    hideTip();
  }

  window.__openStats = async function () {
    if (!overlay) {
      overlay = el('div', 'stats-overlay');
      overlay.append(el('div', 'stats-inner'));
      document.body.append(overlay);
      tip = el('div', 'chart-tip');
      document.body.append(tip);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && overlay.classList.contains('open')) closeStats();
      });
    }
    state.sessions = await getSessions();
    overlay.classList.add('open');
    render();
  };
})();
</script>
</body>
