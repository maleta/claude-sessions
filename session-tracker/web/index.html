<body>

<div id="app"></div>

<script>window.SESSIONS_DATA = window.SESSIONS_DATA || [];</script>
<script src="sessions-data.js" onerror="console.warn('sessions-data.js not found - no sessions tracked yet')"></script>
<script src="https://cdn.jsdelivr.net/npm/@maleta/blokjs/dist/blokjs.min.js"></script>
<script>
function relativeTime(dateStr) {
  if (!dateStr) return '';
  const ts = Date.parse(dateStr.replace(' ', 'T') + 'Z');
  if (isNaN(ts)) return dateStr;
  const diff = Math.floor((Date.now() - ts) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 120) return '1 minute ago';
  if (diff < 3600) return '~' + Math.floor(diff / 60) + ' minutes ago';
  if (diff < 7200) return '~1 hour ago';
  if (diff < 86400) return '~' + Math.floor(diff / 3600) + ' hours ago';
  if (diff < 172800) return 'yesterday';
  if (diff < 604800) return Math.floor(diff / 86400) + ' days ago';
  if (diff < 2592000) return Math.floor(diff / 604800) + ' weeks ago';
  return dateStr;
}

function formatTokens(n) {
  if (!n) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

// $ per 1M tokens (cache write = 5m TTL rate)
const PRICE_PRESETS = {
  fable: { input: 10, output: 50, cache_read: 0.25, cache_write: 12.5 },
  opus: { input: 4, output: 20, cache_read: 0.2, cache_write: 5 },
};
const COST_STORAGE_KEY = 'claude-sessions-cost';
const COST_DEFAULTS = { enabled: true, ...PRICE_PRESETS.fable };

function loadCostConfig() {
  try {
    const raw = localStorage.getItem(COST_STORAGE_KEY);
    if (raw) return { ...COST_DEFAULTS, ...JSON.parse(raw) };
  } catch (e) { /* ignore */ }
  return { ...COST_DEFAULTS };
}

function saveCostConfig(cfg) {
  localStorage.setItem(COST_STORAGE_KEY, JSON.stringify(cfg));
}

const SPLIT_RESUME_STORAGE_KEY = 'claude-sessions-split-resume';

function loadSplitResume() {
  return localStorage.getItem(SPLIT_RESUME_STORAGE_KEY) === 'true';
}

// Placeholders: {path} project path, {id} session id, {dir} transcript folder name
// (the project path with every non-alphanumeric char as '-', as under ~/.claude/projects).
const RESUME_DEFAULTS = {
  resume_host: 'cd {path} && claude-host --resume {id}',
  resume_sbx: 'mkdir -p ~/.claude-sbx/projects/{dir} && cp -n ~/.claude/projects/{dir}/{id}.jsonl ~/.claude-sbx/projects/{dir}/;' +
    ' cd {path} && claude -- --resume {id}',
};

function fillResume(template, session) {
  const vars = {
    path: session.project_path,
    id: session.id,
    dir: session.project_path.replace(/[^A-Za-z0-9]/g, '-'),
  };
  return template.replace(/\{(path|id|dir)\}/g, (_, k) => vars[k]);
}

function tokenCost(tk, price) {
  return ((tk.input || 0) * price.input + (tk.output || 0) * price.output +
    (tk.cache_read || 0) * price.cache_read + (tk.cache_write || 0) * price.cache_write) / 1e6;
}

function formatCost(c) {
  if (!c) return '$0';
  if (c < 0.01) return '<$0.01';
  return '$' + (c >= 100 ? c.toFixed(0) : c.toFixed(2));
}

const STORAGE_KEY = 'claude-sessions-hidden';

function loadHidden() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return { sessions: [], projects: [] };
}

function saveHidden(sessions, projects) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ sessions, projects }));
}

const FAV_STORAGE_KEY = 'claude-sessions-favorites';

function loadFavorites() {
  try {
    const raw = localStorage.getItem(FAV_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return [];
}

const NOTES_STORAGE_KEY = 'claude-sessions-notes';

function loadNotes() {
  try {
    const raw = localStorage.getItem(NOTES_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* ignore */ }
  return {};
}

const SUMMARY_MODELS = ['haiku', 'sonnet', 'opus'];
const PB_STORAGE_KEY = 'claude-sessions-pb';
const PB_DEFAULT_URL = 'http://127.0.0.1:8090';
const PB_COLLECTION = 'session_state';
const PB_SETTINGS_COLLECTION = 'tracker_settings';
const PB_COLLECTIONS = [
  {
    name: PB_COLLECTION,
    fields: [
      { name: 'session_id', type: 'text', required: true },
      { name: 'note', type: 'text' },
      { name: 'favorite', type: 'bool' },
    ],
    indexes: ['CREATE UNIQUE INDEX idx_' + PB_COLLECTION + '_session ON ' + PB_COLLECTION + ' (session_id)'],
  },
  {
    name: PB_SETTINGS_COLLECTION,
    fields: [
      { name: 'resume_host', type: 'text' },
      { name: 'resume_sbx', type: 'text' },
      { name: 'summary_model', type: 'text' },
    ],
    indexes: [],
  },
];

function loadPbUrl() {
  try {
    return JSON.parse(localStorage.getItem(PB_STORAGE_KEY) || '{}').url || '';
  } catch (e) { return ''; }
}

function pbConfigured() {
  return localStorage.getItem(PB_STORAGE_KEY) !== null;
}

function savePbUrl(url) {
  localStorage.setItem(PB_STORAGE_KEY, JSON.stringify({ url }));
}

async function pbRequest(url, path, options = {}) {
  const res = await fetch(url.replace(/\/+$/, '') + path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(body.message || 'HTTP ' + res.status);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

function pbRecords(path = '', collection = PB_COLLECTION) {
  return '/api/collections/' + collection + '/records' + path;
}

// The settings collection holds a single record.
async function pbFetchSettings(url) {
  const body = await pbRequest(url, pbRecords('?perPage=1', PB_SETTINGS_COLLECTION));
  return (body.items || [])[0] || null;
}

async function pbSaveSettings(url, id, fields) {
  return pbRequest(url, pbRecords(id ? '/' + id : '', PB_SETTINGS_COLLECTION), {
    method: id ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(fields),
  });
}

async function pbFetchState(url) {
  const body = await pbRequest(url, pbRecords('?perPage=500'));
  return body.items || [];
}

async function pbUpsert(url, sessionId, fields) {
  const filter = encodeURIComponent("session_id='" + sessionId + "'");
  const found = await pbRequest(url, pbRecords('?filter=' + filter));
  const existing = (found.items || [])[0];
  return pbRequest(url, pbRecords(existing ? '/' + existing.id : ''), {
    method: existing ? 'PATCH' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, ...fields }),
  });
}

// Returns the names of required collections that do not exist or lack a field; throws when PocketBase is unreachable.
// PocketBase drops unknown fields on write without an error, but rejects a filter on one with a 400.
async function pbMissingCollections(url) {
  const missing = [];
  for (const c of PB_COLLECTIONS) {
    const filter = encodeURIComponent(c.fields.map(f => f.name + ' = null').join(' || '));
    try {
      await pbRequest(url, pbRecords('?perPage=1&filter=' + filter, c.name));
    } catch (err) {
      if (err.status !== 404 && err.status !== 400) throw err;
      missing.push(c.name);
    }
  }
  return missing;
}

// Superuser credentials are used for this one call and never stored.
// The collections have open rules, so later reads and writes need no auth.
async function pbCreateCollections(url, email, password, names) {
  const auth = await pbRequest(url, '/api/collections/_superusers/auth-with-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ identity: email, password }),
  });
  for (const c of PB_COLLECTIONS.filter(c => names.includes(c.name))) {
    const existing = await pbRequest(url, '/api/collections/' + c.name, { headers: { Authorization: auth.token } })
      .catch(err => { if (err.status === 404) return null; throw err; });
    if (existing) {
      const have = new Set(existing.fields.map(f => f.name));
      await pbRequest(url, '/api/collections/' + existing.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: auth.token },
        body: JSON.stringify({ fields: [...existing.fields, ...c.fields.filter(f => !have.has(f.name))] }),
      });
      continue;
    }
    try {
      await pbRequest(url, '/api/collections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: auth.token },
        body: JSON.stringify({
          name: c.name,
          type: 'base',
          listRule: '', viewRule: '', createRule: '', updateRule: '', deleteRule: '',
          fields: c.fields,
          indexes: c.indexes,
        }),
      });
    } catch (err) {
      if (err.body?.data?.name?.code !== 'validation_collection_name_exists') throw err;
    }
  }
}

const stored = loadHidden();
const costConfig = loadCostConfig();
let _debounceTimer = null;
let _resumeSaveTimer = null;
let _resumeSaved = { ...RESUME_DEFAULTS };
let _modelSaved = '';

// Pre-process sessions once: sort, build search index, parse topics, build derived fields
const _raw = (window.SESSIONS_DATA || [])
  .map(s => ({
    ...s,
    started_at: s.started_at || s.date || '',
    updated_at: s.updated_at || s.date || '',
  }))
  .sort((a, b) => (b.updated_at || b.started_at).localeCompare(a.updated_at || a.started_at))
  .map(s => {
    const tk = s.tokens || { input: 0, output: 0, cache_write: 0, cache_read: 0 };
    return {
    ...s,
    _search: [s.id, s.title, s.summary, s.topics, s.project, s.project_path, ...(s.done || []),
      ...(s.artifacts || []).flatMap(a => [a.title, a.url])].join('\0').toLowerCase(),
    _topics: s.topics.split(',').map(t => t.trim()).filter(Boolean),
    _artifacts: s.artifacts || [],
    _done: s.done || [],
    _badgeClass: 'badge badge-' + s.status,
    _msgLabel: s.messages + ' msgs',
    _endPrefix: s.updated_at && s.updated_at !== s.started_at ? (s.status === 'completed' ? 'end' : 'latest') : '',
    _isHidden: false,
    _isFav: false,
    _tok: {
      in: formatTokens(tk.input),
      out: formatTokens(tk.output),
      cw: formatTokens(tk.cache_write),
      cr: formatTokens(tk.cache_read),
    },

  mount() {
    setInterval(() => { this.tick++; }, 60000);
    const refresh = () => {

        .catch(err => { this.pbStatus = 'PocketBase unreachable: ' + err.message; this.pbLive = false; });

  watch: {
    searchInput(val) {

      _debounceTimer = setTimeout(() => { this.search = val; }, 200);
    },
    priceInput() { this._saveCost(); },
    priceOutput() { this._saveCost(); },
    priceCacheRead() { this._saveCost(); },
    priceCacheWrite() { this._saveCost(); },
    resumeHost() { this._saveResume(); },
    resumeSbx() { this._saveResume(); },

  computed: {
    prices() {
      return {
        input: Number(this.priceInput) || 0,
        output: Number(this.priceOutput) || 0,
        cache_read: Number(this.priceCacheRead) || 0,
        cache_write: Number(this.priceCacheWrite) || 0,
      };
    },
    filtered() {
      const q = this.search.trim().toLowerCase();
      let result = this.sessions;
      if (q) {
        result = result.filter(s => s._search.includes(q));
      }
      if (this.showHidden) return result;
      const hiddenIds = new Set(this.hiddenSessionIds);
      const hiddenPaths = new Set(this.hiddenProjectPaths);
      return result.filter(s =>
        !hiddenIds.has(s.id) && !hiddenPaths.has(s.project_path)

    },
    grouped() {
      void this.tick;
      const map = new Map();
      const hiddenIds = new Set(this.hiddenSessionIds);
      const hiddenPaths = new Set(this.hiddenProjectPaths);
      const favIds = new Set(this.pbLive ? this.favoriteIds : []);
      const notes = this.pbLive ? this.notes : {};
      const prices = this.prices;
      const costEnabled = this.costEnabled;
      for (const s of this.filtered) {
        const path = s.project_path;
        if (!map.has(path)) map.set(path, []);
        s._isHidden = hiddenIds.has(s.id);
        s._isFav = favIds.has(s.id);
        s._note = notes[s.id] || '';
        const cost = tokenCost(s.tokens || {}, prices);
        s._tokCost = costEnabled ? formatCost(cost) : '';
        s._tokTitle = s._tokTitleBase + (costEnabled ? '\ncost: $' + cost.toFixed(4) : '');
        s._startLabel = 'start: ' + relativeTime(s.started_at);
        s._endLabel = s._endPrefix ? s._endPrefix + ': ' + relativeTime(s.updated_at) : '';
        map.get(path).push(s);
      }
      return Array.from(map, ([path, sessions]) => ({
        projectPath: path,
        sessions: [...sessions.filter(s => s._isFav), ...sessions.filter(s => !s._isFav)],

    dbStateText() {

    },
    costBtnText() {
      return this.costEnabled ? 'on' : 'off';

    resumeHint() {

    resumeLocked() {

    summaryModelHint() {

    needsLogin() {
      return !this.pbUrl || this.pbMissing.length > 0;
    },
    storageText() {
      return this.pbUrl ? 'PocketBase at ' + this.pbUrl : 'not connected, notes and favorites are off';
    },
    hiddenBtnText() {
      return (this.showHidden ? 'hide' : 'show') + ' ' + this.hiddenCount + ' hidden';
    },
    tokensText() {
      let inp = 0, out = 0, cw = 0, cr = 0;
      for (const s of this.filtered) {
        const tk = s.tokens || {};
        inp += tk.input || 0; out += tk.output || 0; cw += tk.cache_write || 0; cr += tk.cache_read || 0;
      }
      const text = 'tokens · regular ' + formatTokens(inp) + ' in / ' + formatTokens(out) +
        ' out · cached ' + formatTokens(cr) + ' read / ' + formatTokens(cw) + ' write';
      if (!this.costEnabled) return text;
      return text + ' · ' + formatCost(tokenCost({ input: inp, output: out, cache_read: cr, cache_write: cw }, this.prices));
    },
  },

  methods: {

      this.showHidden = !this.showHidden;
    },
    toggleFavorite(id) {
      this.favoriteIds = this.favoriteIds.includes(id)
        ? this.favoriteIds.filter(x => x !== id)
        : [...this.favoriteIds, id];
      this._syncSession(id, { favorite: this.favoriteIds.includes(id) });

    editNote(id) {
      this.editingId = id;
      this.noteDraft = this.notes[id] || '';
    },
    cancelNote() {
      this.editingId = '';
    },
    saveNote() {
      const id = this.editingId;
      const text = this.noteDraft.trim();
      const notes = { ...this.notes };
      if (text) notes[id] = text; else delete notes[id];
      this.notes = notes;
      this._syncSession(id, { note: text });
      this.editingId = '';
    },
    openSettings() {
      this.showSettings = !this.showSettings;
    },
    toggleCost() {
      this.costEnabled = !this.costEnabled;
      this._saveCost();
    },
    resetToOpus() {
      this._applyPrices(PRICE_PRESETS.opus);
    },
    resetToFable() {
      this._applyPrices(PRICE_PRESETS.fable);
    },
    _applyPrices(p) {
      this.priceInput = String(p.input);
      this.priceOutput = String(p.output);
      this.priceCacheRead = String(p.cache_read);
      this.priceCacheWrite = String(p.cache_write);
    },
    toggleSplitResume() {
      this.splitResume = !this.splitResume;
      localStorage.setItem(SPLIT_RESUME_STORAGE_KEY, String(this.splitResume));

    setSummaryModel(model) {
      if (!this.pbLive || model === _modelSaved) return;
      pbSaveSettings(this.pbUrl, this.settingsId, { summary_model: model })
        .then(rec => { this.settingsId = rec.id; _modelSaved = model; this.summaryModel = model; this.pbStatus = ''; })
        .catch(err => { this.pbStatus = 'settings save failed: ' + err.message; });
    },
    resetResume() {
      this.resumeHost = RESUME_DEFAULTS.resume_host;
      this.resumeSbx = RESUME_DEFAULTS.resume_sbx;
    },
    // Watchers fire on every keystroke and on loads from PocketBase; only a changed value is written.
    _saveResume() {
      if (!this.pbLive) return;
      clearTimeout(_resumeSaveTimer);
      _resumeSaveTimer = setTimeout(() => {
        const fields = { resume_host: this.resumeHost, resume_sbx: this.resumeSbx };
        if (fields.resume_host === _resumeSaved.resume_host && fields.resume_sbx === _resumeSaved.resume_sbx) return;
        pbSaveSettings(this.pbUrl, this.settingsId, fields)
          .then(rec => { this.settingsId = rec.id; _resumeSaved = fields; this.pbStatus = ''; })
          .catch(err => { this.pbStatus = 'settings save failed: ' + err.message; });

    closeSettings() {

    async connectPb() {
      const url = this.pbUrlInput.trim() || PB_DEFAULT_URL;
      const email = this.pbEmail.trim();
      this.pbStatus = 'connecting...';
      try {
        await this.initPb(url, email ? { email, password: this.pbPassword } : null);
        if (this.pbLive) this.closeSettings();
      } catch (err) {
        this.pbStatus = 'init failed: ' + err.message;
      }
    },
    // A browser that never chose a storage joins a PocketBase at the default URL that already holds a tracker collection.
    async adoptDefaultPb() {
      let missing;
      try {
        missing = await pbMissingCollections(PB_DEFAULT_URL);
      } catch (e) { return; }
      if (missing.length === PB_COLLECTIONS.length) return;
      this.initPb(PB_DEFAULT_URL)
        .catch(err => { this.pbStatus = 'sync failed: ' + err.message; });
    },
    // Run on every connection: makes sure every required collection exists, then loads the data.
    // Creating a missing collection needs the superuser login; without one the page stays offline and asks for it.
    async initPb(url, login = null) {
      this.pbInitsRunning++;
      try {
        let missing = await pbMissingCollections(url);
        if (missing.length && login) {
          await pbCreateCollections(url, login.email, login.password, missing);
          missing = [];
        }
        this.pbMissing = missing;
        if (missing.length) {
          this.pbLive = false;
          this.pbStatus = 'collections to create or update: ' + missing.join(', ') + '. Enter the superuser login to set them up.';
          return;
        }
        await this._joinPb(url);
        this.pbStatus = '';
      } finally {
        this.pbInitsRunning--;
      }
    },
    // Notes and favorites kept in localStorage by older versions are moved into PocketBase once.
    async _joinPb(url) {
      const remote = new Map((await pbFetchState(url)).map(r => [r.session_id, r]));
      const localNotes = loadNotes();
      const localFavs = loadFavorites();
      const ids = new Set([...Object.keys(localNotes), ...localFavs]);
      for (const id of ids) {
        const r = remote.get(id);
        const fields = {};
        if (localNotes[id] && !r?.note) fields.note = localNotes[id];
        if (localFavs.includes(id) && !r?.favorite) fields.favorite = true;
        if (Object.keys(fields).length) await pbUpsert(url, id, fields);
      }
      localStorage.removeItem(NOTES_STORAGE_KEY);
      localStorage.removeItem(FAV_STORAGE_KEY);
      savePbUrl(url);
      this.pbUrl = url;
      await this.loadFromPb();

    disconnectPb() {

    async loadFromPb() {

      if (!this.pbUrl) return;

        .then(() => { this.pbStatus = ''; })
        .catch(err => { this.pbStatus = 'sync failed: ' + err.message; this.pbLive = false; });

    hideSession(id) {

      saveHidden(this.hiddenSessionIds, this.hiddenProjectPaths);
    },
    restoreSession(id) {

    hideProject(path) {

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    },

                    ]}},
                    { when: $.costEnabled, children: [
                      { span: { class: 'tok-cost', text: $.s._tokCost } },
                    ]},
                  ]}},
                  { when: $.s._artifacts.length, children: [
                    { div: { class: 'card-artifacts', children: [
                      { each: $.s._artifacts, as: 'art', children: [
                        { a: {
                          class: 'artifact-link',
                          bind: { href: $.art.url, title: $.art.url },
                          target: '_blank',
                          rel: 'noopener',
                          text: $.art.title,
                        }},
                      ]},
                    ]}},
                  ]},
                  { when: $.s._note, children: [
                    { div: { class: 'card-note', text: $.s._note } },
                  ]},
                  { div: { class: 'card-footer', children: [
                    { div: { class: 'topics', children: [
                      { each: $.s._topics, as: 't', children: [
                        { span: { class: 'topic', text: $.t } },
                      ]},
                    ]}},
                    { div: { class: 'card-actions', children: [
                      { when: $.pbLive, children: [
                        { button: {
                          class: ['note-btn', { 'has-note': $.s._note }],
                          click: 'editNote(s.id)',
                          bind: { title: 'Add or edit a note for this session' },
                          text: 'note',
                        }},
                        { button: {
                          class: ['fav-btn', { active: $.s._isFav }],
                          click: 'toggleFavorite(s.id)',
                          bind: { title: 'Pin session to the top of its project' },
                          text: '★',
                        }},
                      ]},
                      { when: $.s._isHidden, children: [
                        { button: {
                          class: 'restore-btn',
                          click: 'restoreSession(s.id)',
                          text: 'restore',
                        }},
                      ]},
                      { when: $.not.s._isHidden, children: [
                        { button: {
                          class: 'hide-btn',
                          click: 'hideSession(s.id)',
                          text: 'hide',
                        }},
                      ]},
                      { when: $.splitResume, children: [
                        { button: {
                          class: 'resume-btn',
                          click: 'copyResume(s)',
                          bind: { title: 'Copy resume command (native claude on the host)' },
                          text: 'resume host',
                        }},
                        { button: {
                          class: 'resume-btn',
                          click: 'copySbxResume(s)',
                          bind: { title: 'Copy resume command (sandbox)' },
                          text: 'resume sbx',
                        }},
                      ]},
                      { when: $.not.splitResume, children: [
                        { button: {
                          class: 'resume-btn',
                          click: 'copyPlainResume(s)',
                          bind: { title: 'Copy resume command' },
                          text: 'resume',
                        }},
                      ]},
                    ]}},
                  ]}},
                ]}},
              ]},
            ]}},
          ]}},
        ]},

        { when: $.not.filtered.length, children: [
          { div: { class: 'no-results', text: 'No sessions found.' } },
        ]},
      ]}},

      { div: { class: ['copied-toast', { show: $.showToast }], text: 'Copied to clipboard!' } },

      { when: $.editingId, children: [
        { div: { class: 'overlay', children: [
          { div: { class: 'panel', children: [
            { h2: 'Session note' },
            { textarea: {
              class: 'panel-field',
              bind: { placeholder: 'Anything worth remembering about this session...' },
              model: $.noteDraft,
            }},
            { div: { class: 'panel-actions', children: [
              { button: { class: 'resume-btn', click: 'cancelNote', text: 'cancel' } },
              { button: { class: 'resume-btn', click: 'saveNote', text: 'save' } },
            ]}},
          ]}},
        ]}},
      ]},
    ]},
  }),
});
</script>
</body>
</html>
